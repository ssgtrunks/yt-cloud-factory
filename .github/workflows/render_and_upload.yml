name: Cloud Video Render and Stage

on:
  push:
    paths:
      - 'scripts/**/*.json'
  schedule:
    # Runs automatically every Sunday at 10:00 AM IST (04:30 UTC) while laptop is off
    - cron: '30 4 * * 0'
  workflow_dispatch:
    inputs:
      script_path:
        description: 'Path to script JSON (or type NEXT to render next queued episode across all channels)'
        required: true
        default: 'NEXT'

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install FFmpeg, Fonts, and Headless Browser Libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Remotion packages
        run: npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install edge-tts requests google-api-python-client google-auth

      - name: Render Remotion Video, Backup to 5TB Drive, and Stage to YouTube
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          YT_TOKEN_CAPLEDGER: ${{ secrets.YT_TOKEN_CAPLEDGER }}
          YT_TOKEN_WORKFLOWSTACK: ${{ secrets.YT_TOKEN_WORKFLOWSTACK }}
          YT_TOKEN_MARKETANATOMY: ${{ secrets.YT_TOKEN_MARKETANATOMY }}
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            CHANGED_JSON=$(git diff --name-only HEAD~1 HEAD -- 'scripts/**/*.json')
            for file in $CHANGED_JSON; do
              if [ -f "$file" ]; then
                echo "Processing newly pushed script: $file"
                python cloud_builder.py "$file"
              fi
            done
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.script_path }}" != "NEXT" ]; then
            python cloud_builder.py "${{ github.event.inputs.script_path }}"
          else
            # Weekly Sunday Cron or manual NEXT trigger: picks the latest episode per channel folder
            for dir in scripts/*/; do
              LATEST=$(ls -1 "$dir"ep*.json 2>/dev/null | sort | tail -n 1)
              if [ -f "$LATEST" ]; then
                echo "Scheduled weekly batch rendering: $LATEST"
                python cloud_builder.py "$LATEST"
              fi
            done
          fi
